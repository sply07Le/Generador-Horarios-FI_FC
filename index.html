<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Horarios</title>
  <style>
/* ── TOKENS ───────────────────────────────────────────────── */
:root {
  --navy:       #1B3A6B;
  --navy-dark:  #142d55;
  --teal:       #2D7080;
  --teal-light: #e8f4f6;
  --bg:         #eef1f7;
  --white:      #ffffff;
  --border:     #c8d2e0;
  --text:       #1a1e2d;
  --text-mid:   #4b5563;
  --text-soft:  #9ca3af;
  --red:        #ef4444;
  --radius:     8px;
  --shadow:     0 2px 16px rgba(0,0,0,0.09);
  --font:       'Segoe UI', system-ui, -apple-system, sans-serif;
  /* Customizable table colors */
  --table-header-bg: #1B3A6B;
  --table-header-text: #ffffff;
  --table-line-color: #c8d2e0;
  --table-cell-bg: #ffffff;
  --table-empty-bg: #f4f7fb;
  --alumno-color: #2D7080;
  --carrera-color: #2D7080;
  --semestre-text-color: #ffffff;
  --semestre-bg: #2D7080;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ── APP SHELL ───────────────────────────────────────────── */
.app { min-height: 100vh; display: flex; flex-direction: column; }

/* NAV */
.app-nav {
  background: var(--navy);
  color: #fff;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
}

.brand-icon { font-size: 1.1rem; opacity: 0.85; }

.nav-tabs { display: flex; gap: 4px; flex: 1; }

.nav-tab {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.65);
  padding: 5px 16px;
  border-radius: 20px;
  font-size: 0.82rem;
  transition: all 0.15s;
}
.nav-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-tab.active {
  background: #fff;
  color: var(--navy);
  font-weight: 700;
  border-color: #fff;
}

.nav-actions { display: flex; gap: 8px; }

.btn-export {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 0.8rem;
  transition: background 0.15s;
}
.btn-export:hover:not(:disabled) { background: rgba(255,255,255,0.22); }
.btn-export:disabled { opacity: 0.5; }

/* MAIN */
.app-main {
  flex: 1;
  padding: 24px;
  max-width: 1340px;
  width: 100%;
  margin: 0 auto;
}

/* LAYOUT HORARIO + PANEL */
.horario-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

.horario-layout .horario-col {
  flex: 1;
  min-width: 0;
}

/* PANEL LATERAL */
.side-panel {
  width: 260px;
  flex-shrink: 0;
  background: var(--white);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.side-panel-header {
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.4px;
}

.side-panel-body {
  padding: 10px 0;
  max-height: 560px;
  overflow-y: auto;
}

.side-materia-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid #f3f4f6;
  transition: background 0.1s;
}
.side-materia-item:hover { background: #f8fafc; }
.side-materia-item:last-child { border-bottom: none; }

.side-clave-tag {
  display: inline-block;
  color: #fff;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.7rem;
  white-space: nowrap;
}

.side-materia-info {
  flex: 1;
  min-width: 0;
}

.side-materia-nombre {
  font-size: 0.73rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.side-materia-prof {
  font-size: 0.67rem;
  color: var(--text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn-edit-materia {
  background: none;
  border: none;
  color: var(--text-soft);
  font-size: 0.8rem;
  padding: 3px 5px;
  border-radius: 4px;
  transition: color 0.15s, background 0.15s;
}
.btn-edit-materia:hover { color: var(--teal); background: var(--teal-light); }

/* TOOLBAR */
.toolbar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.toolbar-hint { font-size: 0.82rem; color: var(--text-soft); }

/* BUTTONS */
.btn-primary {
  background: var(--navy);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: var(--radius);
  font-size: 0.88rem;
  font-weight: 600;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--navy-dark); }

.btn-ghost {
  background: transparent;
  color: var(--text-mid);
  border: 1px solid var(--border);
  padding: 8px 18px;
  border-radius: var(--radius);
  font-size: 0.88rem;
}
.btn-ghost:hover { background: #f3f4f6; }

.btn-icon-sm {
  background: none;
  border: none;
  color: var(--text-soft);
  font-size: 0.8rem;
  padding: 2px 6px;
  border-radius: 4px;
  transition: color 0.15s, background 0.15s;
}
.btn-icon-sm:hover { color: var(--red); background: #fee2e2; }

/* ── HORARIO WRAPPER ─────────────── */
.horario-wrapper {
  background: var(--white);
  border-radius: 12px;
  padding: 18px 16px 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  max-width: 1040px;
  margin: 0 auto;
}

.horario-wrapper.no-prof {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.horario-wrapper.no-prof .horario-header-logos { width: 100%; }
.horario-wrapper.no-prof .table-scroll { width: 100%; }

/* Background image layer */
.horario-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  pointer-events: none;
  z-index: 0;
}

.horario-wrapper > *:not(.horario-bg) {
  position: relative;
  z-index: 1;
}

.horario-top {
  display: flex;
  justify-content: center;
  margin-bottom: 14px;
}

.semestre-pill {
  background: var(--semestre-bg);
  color: var(--semestre-text-color);
  padding: 10px 48px;
  border-radius: 30px;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.4px;
}

.estudio-pill { font-size: 1rem; }

/* Logo area in exported header */
.horario-header-logos {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 36px;
  margin-bottom: 16px;
  min-height: 76px;
}

.logo-slot {
  width: 92px;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-slot img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.horario-header-center {
  flex: 1;
  text-align: center;
  padding: 0 18px;
}

.horario-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 0.88rem;
  font-weight: 700;
  gap: 28px;
}

.meta-alumno { color: var(--alumno-color); }
.meta-carrera { color: var(--carrera-color); }

.horario-meta span {
  min-width: 0;
  overflow-wrap: anywhere;
}

/* TABLE SCROLL */
.table-scroll { overflow-x: auto; }

/* ── SCHEDULE TABLE ───────────────────────────────────────── */
.horario-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 0.73rem;
  min-width: 660px;
}

.horario-table thead th {
  background: var(--table-header-bg);
  color: var(--table-header-text);
  padding: 9px 6px;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 600;
  border: 1px solid var(--table-line-color);
}

.th-corner { width: 112px; }

.corner-inner {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  font-size: 0.72rem;
  font-weight: 600;
}

.corner-dia { text-align: right; padding-right: 4px; }
.corner-hora { text-align: left; padding-left: 4px; }

.corner-divider {
  height: 1px;
  background: rgba(255,255,255,0.3);
  transform: rotate(20deg);
  margin: 1px 0;
}

.th-dia { text-align: center; }

.td-hora {
  background: var(--table-header-bg);
  color: var(--table-header-text);
  text-align: center;
  padding: 4px 8px;
  font-size: 0.73rem;
  font-weight: 600;
  white-space: nowrap;
  border: 1px solid var(--table-line-color);
  vertical-align: middle;
}

.td-hora span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  line-height: 1.15;
}

/* CELLS */
.td-cell {
  border: 2px solid var(--table-line-color);
  height: 56px;
  vertical-align: top;
  padding: 0;
}

.td-vacia { background: var(--table-empty-bg); }
.td-ocupada { background: var(--table-cell-bg); }
.td-lab { background: #eef2f8; }
.td-libre { background: var(--table-empty-bg); }

/* Cell inner layout */
.cell-inner {
  display: flex;
  height: 100%;
  min-height: 56px;
  position: relative;
}

/* Compact export tweaks: applied only during PDF export to reduce row height */
.export-compact .td-cell { height: 36px !important; }
.export-compact .cell-inner { min-height: 36px !important; }
.export-compact .cell-nombre { font-size: 0.64rem !important; }
.export-compact .cell-clave, .export-compact .cell-sub { font-size: 0.58rem !important; }
/* Reduce professor table density during export to avoid extra pages */
.export-compact .prof-table th,
.export-compact .prof-table td {
  padding: 4px 8px !important;
  font-size: 0.62rem !important;
}
.export-compact .prof-grid { gap: 8px !important; }
.export-compact .prof-section { margin-top: 8px !important; }

.cell-bar {
  width: 7px;
  flex-shrink: 0;
}

.cell-body {
  padding: 5px 20px 5px 7px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  min-width: 0;
}

.cell-lab-label {
  font-size: 0.64rem;
  font-weight: 700;
  color: var(--text-mid);
  line-height: 1;
}

.cell-nombre {
  font-weight: 700;
  font-size: 0.68rem;
  line-height: 1.18;
  color: var(--text);
  overflow-wrap: anywhere;
}

.cell-clave { font-weight: 400; color: var(--text-mid); }

.cell-lab-bold {
  font-weight: 800;
  font-size: 0.69rem;
  color: var(--text);
}

.cell-sub {
  font-size: 0.64rem;
  color: var(--text-mid);
  line-height: 1.2;
}

/* Delete button (hover) */
.cell-delete {
  position: absolute;
  top: 3px;
  right: 4px;
  background: none;
  border: none;
  font-size: 1rem;
  color: var(--text-soft);
  line-height: 1;
  padding: 1px 3px;
  border-radius: 3px;
  display: none;
  cursor: pointer;
}
.td-cell:hover .cell-delete { display: block; }
.cell-delete:hover { color: var(--red); background: #fee2e2; }

/* ── PROFESSOR TABLE ──────────────────────────────────────── */
.prof-section { margin-top: 18px; }

.prof-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.prof-table {
  border-collapse: collapse;
  font-size: 0.77rem;
  width: 100%;
}

.prof-table th {
  background: var(--table-header-bg);
  color: var(--table-header-text);
  padding: 7px 14px;
  text-align: left;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--table-line-color);
}

.prof-table td {
  border: 1px solid var(--table-line-color);
  padding: 5px 14px;
  vertical-align: middle;
}

.clave-tag {
  display: inline-block;
  color: #fff;
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.75rem;
}

.prof-nombre { font-size: 0.75rem; }

/* ── FORM MODAL ───────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-box {
  background: #1e2535;
  border-radius: 12px;
  padding: 0;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  color: #e8eaf0;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding-bottom: 16px;
}

.modal-header h2 {
  font-size: 1.1rem;
  color: #ffffff;
  margin: 0;
}

.modal-close {
  background: rgba(255,255,255,0.08);
  border: none;
  font-size: 1.2rem;
  color: rgba(255,255,255,0.6);
  line-height: 1;
  padding: 4px 10px;
  border-radius: 6px;
}
.modal-close:hover { background: rgba(255,255,255,0.15); color: #fff; }

.modal-box .form-group {
  padding: 0 24px;
  margin-top: 16px;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
  margin-bottom: 5px;
}

.label-hint { font-weight: 400; color: rgba(255,255,255,0.4); }

.form-group input,
.form-group select {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 0.86rem;
  color: #ffffff;
  background: rgba(255,255,255,0.09);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.form-group input::placeholder { color: rgba(255,255,255,0.3); }
.form-group input:focus,
.form-group select:focus {
  border-color: rgba(100,160,255,0.6);
  background: rgba(255,255,255,0.13);
}
.form-group select option { background: #1e2535; color: #fff; }

/* 3-col row */
.form-row-3 {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
  padding: 0 24px;
  margin-top: 16px;
}

.form-row-3 .form-group {
  padding: 0;
  margin-top: 0;
}

/* Search */
.search-wrap { position: relative; }

.search-dropdown {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: #252d42;
  border: 1px solid rgba(255,255,255,0.15);
  border-top: none;
  border-radius: 0 0 8px 8px;
  z-index: 10;
  max-height: 220px;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

.search-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  background: none;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  text-align: left;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.1s;
  color: #e8eaf0;
}
.search-item:hover { background: rgba(45, 112, 128, 0.35); }

.search-clave { font-weight: 700; color: #7ec8d8; white-space: nowrap; }
.search-nombre { flex: 1; color: #e8eaf0; }
.search-creds { font-size: 0.72rem; color: rgba(255,255,255,0.45); white-space: nowrap; }

.selected-badge {
  margin-top: 6px;
  font-size: 0.8rem;
  color: #5eead4;
  font-weight: 500;
}

/* Colors */
.color-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.swatch {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  padding: 0;
}
.swatch:hover { transform: scale(1.15); }
.swatch-active { border-color: #fff; transform: scale(1.15); }

.color-custom-wrap input[type="color"] {
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  padding: 2px;
  cursor: pointer;
  background: none;
}

/* Sessions */
.sesiones-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.sesiones-header label { margin-bottom: 0; }

  .toggle-custom {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem !important;
  font-weight: 500 !important;
  color: rgba(255,255,255,0.85) !important;
  cursor: pointer;
  min-height: 36px;
  line-height: 1.2;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
}
.toggle-custom input {
  width: auto;
  cursor: pointer;
  margin: 0;
}

.salon-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
}

.checkbox-group { display: flex; flex-direction: column; gap: 10px; }
.checkbox-group .toggle-custom { width: 100%; }

.sesiones-list { display: flex; flex-direction: column; gap: 6px; }

.sesion-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.sesion-row select {
  width: auto;
  padding: 5px 8px;
  font-size: 0.82rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.09);
  color: #fff;
}
.sesion-row select option { background: #1e2535; }

.sesion-arrow { color: rgba(255,255,255,0.4); font-size: 0.9rem; }

.sesion-hora-fin {
  font-size: 0.82rem;
  font-weight: 600;
  color: #7ec8d8;
  min-width: 44px;
}

.sesion-lab {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.78rem !important;
  font-weight: 400 !important;
  color: rgba(255,255,255,0.55) !important;
  cursor: pointer;
  margin-bottom: 0 !important;
}
.sesion-lab input { width: auto; }

.sesion-salon-input {
  flex: 1 1 160px;
  min-width: 150px;
  max-width: 240px;
  padding: 5px 8px !important;
  font-size: 0.82rem !important;
}

.btn-add-sesion {
  background: rgba(255,255,255,0.05);
  border: 1px dashed rgba(255,255,255,0.2);
  color: #7ec8d8;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  margin-top: 8px;
  width: 100%;
  transition: background 0.15s;
}
.btn-add-sesion:hover { background: rgba(45,112,128,0.2); }

.form-error {
  margin: 0 24px;
  padding: 8px 12px;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
  border-radius: 6px;
  font-size: 0.8rem;
  margin-top: 12px;
}

.conflict-warning {
  margin: 0 24px;
  padding: 8px 12px;
  background: rgba(251, 146, 60, 0.15);
  border: 1px solid rgba(251, 146, 60, 0.4);
  color: #fcd34d;
  border-radius: 6px;
  font-size: 0.79rem;
  margin-top: 10px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px 20px;
  margin-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.modal-footer .btn-ghost {
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.7);
  border-color: rgba(255,255,255,0.15);
}
.modal-footer .btn-ghost:hover { background: rgba(255,255,255,0.12); color: #fff; }

/* ── ESTUDIO INDEPENDIENTE ────────────────────────────────── */
.estudio-resumen { margin-bottom: 16px; }

.estudio-summary-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}

.estudio-summary-table th {
  background: var(--table-header-bg);
  color: var(--table-header-text);
  padding: 8px 12px;
  text-align: left;
  font-size: 0.76rem;

function tieneLabIntegrado(materia) {
  return materia.sesiones && materia.sesiones.some(s => s.esLab);
}

function horasClaseSemanal(materia) {
  return materia.sesiones.reduce((acc, s) => acc + (s.horaFin - s.horaInicio), 0);
}

function horasEstudioSugeridas(materia) {
  if (!materia.horasTeo || materia.horasTeo <= 0) return null;
  const horasPra = materia.horasPra ?? 0;
  return Math.max(0, materia.creditos - (materia.horasTeo + horasPra));
}

function materiasConEstudio(materias) {
  return materias.filter(m => horasEstudioSugeridas(m) !== null);
}

function salonSesion(materia, sesion) {
  return materia.mismoSalon ? materia.salon : (sesion.salon || materia.salon || '');
}

function ordenarPorClave(materias) {
  return [...materias].sort((a, b) => a.clave.localeCompare(b.clave, 'es-MX', { numeric: true }));
}

function horasHorario(config) {
  return Array.from({ length: config.horaMax - config.horaMin }, (_, i) => config.horaMin + i);
}

function crearIntervalosHorario(config, materias) {
  const start = config.horaMin;
  const end = config.horaMax;
  const cortes = new Set([start, end]);
  for (let h = start + 2; h < end; h += 2) cortes.add(h);
  materias.forEach(m => (m.sesiones || []).forEach(s => {
    if (s.horaInicio > start && s.horaInicio < end) cortes.add(s.horaInicio);
    if (s.horaFin > start && s.horaFin < end) cortes.add(s.horaFin);
  }));
  const puntos = [...cortes].sort((a, b) => a - b);
  const porInicio = new Map();
  const cubiertos = new Set();
  for (let i = 0; i < puntos.length - 1; i++) {
    const ini = puntos[i];
    const fin = puntos[i + 1];
    porInicio.set(ini, { ini, fin, rowspan: fin - ini });
    for (let h = ini + 1; h < fin; h++) cubiertos.add(h);
  }
  return { porInicio, cubiertos };
}

function renderCeldaHora(hora, intervalos) {
  if (intervalos.cubiertos.has(hora)) return '';
  const intervalo = intervalos.porInicio.get(hora) || { ini: hora, fin: hora + 1, rowspan: 1 };
  return `<td rowspan="${intervalo.rowspan}" class="td-hora"><span>${intervalo.ini}:00 - ${intervalo.fin}:00</span></td>`;
}

    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.config) this.state.config = { ...this.state.config, ...saved.config };
      if (Array.isArray(saved.materias)) this.state.materias = saved.materias;
      if (saved.vista && VISTAS.includes(saved.vista)) this.state.vista = saved.vista;
      if (typeof saved.filtroFacultad === 'string') this.state.filtroFacultad = saved.filtroFacultad;
    } catch (err) {
      console.warn('No se pudo restaurar la sesión guardada.', err);
    }
  },

  guardarSesion() {
    try {
      const payload = {
        vista: this.state.vista,
        config: this.state.config,
        filtroFacultad: this.state.filtroFacultad,
        materias: this.state.materias
      };
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (err) {
      console.warn('No se pudo guardar la sesión. Revisa si las imágenes subidas son demasiado grandes.', err);
    }
  },

    if (this._focusField) {
      const el = document.getElementById(this._focusField);
      if (el) { el.focus(); const len = el.value.length; el.setSelectionRange(len, len); }
      this._focusField = null;
    }

    this.state.config[key] = value;
    if (['tableHeaderBg','tableLineColor','tableCellBg','tableEmptyBg','alumnoColor','carreraColor','semestreTextColor','semestreBg'].includes(key)) {
      this._applyTableColors();
      this.guardarSesion();
    } else if (key === 'bgOpacity') {
      document.querySelectorAll('.horario-bg').forEach(el => { el.style.opacity = value; });

    } else {
      if (focusId) this._focusField = focusId;
      this.render();
    }

              <div class="logo-slot">${config.logoFiDataUrl ? `<img src="${config.logoFiDataUrl}" alt="FI">` : ''}</div>
            </div>
            <div class="table-scroll">
              <table class="horario-table">
                <thead>
                  <tr>
                    <th class="th-corner"><div class="corner-inner"><span class="corner-dia">Día</span><div class="corner-divider"></div><span class="corner-hora">Hora</span></div></th>
                    ${this.getDiasHorario().map(dia => `<th class="th-dia">${dia}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${horas.map(hora => `
                    <tr>
                      ${renderCeldaHora(hora, intervalos)}
                      ${this.getDiasHorario().map(dia => this.renderCeldaHorario(dia, hora)).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${this.state.config.showProfesorTable ? this.renderProfesorGrid() : ''}
          </div>
        </div>
        ${materias.length > 0 ? `
          <div class="side-panel">
            <div class="side-panel-header">Materias (${materias.length})</div>
            <div class="side-panel-body">
              ${materiasOrdenadas.map(m => `
                <div class="side-materia-item">
                  <span class="side-clave-tag" style="background:${m.color}">${m.clave}</span>
                  <div class="side-materia-info">
                    <div class="side-materia-nombre">${m.nombre}</div>
                    <div class="side-materia-prof">${m.tipo === 'actividad' ? (m.descripcion || 'Actividad extracurricular') : (m.profesor || '')}</div>
                  </div>
                  <button class="btn-edit-materia" onclick="App.abrirEditar('${m.id}')" title="Editar">✏️</button>
                  <button class="btn-icon-sm" onclick="App.eliminarMateria('${m.id}')" title="Eliminar">✕</button>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  },

  renderCeldaHorario(dia, hora) {
    const info = this.getCellInfo(dia, hora);
    if (info && info.sesion.horaInicio < hora) return '';
    if (!info) return `<td class="td-cell td-vacia"></td>`;
    const { materia, sesion } = info;
    const rowspan = sesion.horaFin - sesion.horaInicio;
    const salon = salonSesion(materia, sesion);
    return `
      <td rowspan="${rowspan}" class="td-cell td-ocupada ${sesion.esLab ? 'td-lab' : ''}">
        <div class="cell-inner">
          <div class="cell-bar" style="background-color:${materia.color}"></div>
          <div class="cell-body">
            ${sesion.esLab && materia.tipo !== 'actividad' ? '<div class="cell-lab-label">LAB. DE</div>' : ''}
            <div class="cell-nombre">${materia.nombre}${materia.tipo !== 'actividad' ? ` <span class="cell-clave">[${materia.clave}]</span>` : ''}</div>
            ${materia.tipo === 'actividad' && materia.descripcion ? `<div class="cell-sub">${materia.descripcion}</div>` : ''}
            ${materia.tipo !== 'actividad' ? `<div class="cell-sub">${materia.grupo}</div>` : ''}
            ${salon ? `<div class="cell-sub">${salon}</div>` : ''}
          </div>
          <button class="cell-delete" onclick="App.eliminarMateria('${materia.id}')" title="Eliminar">×</button>
        </div>
      </td>
    `;
  },

  renderProfesorGrid() {
    const { materias } = this.state;
    const materiasProfesores = materias.filter(m => m.tipo !== 'actividad');
    if (!materiasProfesores.length) return '';
    const half = Math.ceil(materiasProfesores.length / 2);
    const left = materiasProfesores.slice(0, half);
    const right = materiasProfesores.slice(half);
    const rows = arr => arr.map(m => `<tr><td><span class="clave-tag" style="background:${m.color}">${m.clave}</span></td><td class="prof-nombre">${(m.profesor||'').toUpperCase()}</td></tr>`).join('');
    return `
      <div class="prof-section">
        <div class="prof-grid">
          <table class="prof-table"><thead><tr><th>CLAVE</th><th>PROFESOR</th></tr></thead><tbody>${rows(left)}</tbody></table>
          ${right.length ? `<table class="prof-table"><thead><tr><th>CLAVE</th><th>PROFESOR</th></tr></thead><tbody>${rows(right)}</tbody></table>` : ''}
        </div>
      </div>
    `;
  },

  // ── VISTA ESTUDIO ────────────────────────────────────────────────────
  renderVistaEstudio() {
    const { config, materias } = this.state;
    const horas = horasHorario(config);
    const intervalos = crearIntervalosHorario(config, materias);
    const materiasEstudio = ordenarPorClave(materiasConEstudio(materias));
    const totalClase = materiasEstudio.reduce((a,m) => a + horasClaseSemanal(m), 0);
    const totalEstudio = materiasEstudio.reduce((a,m) => a + horasEstudioSugeridas(m), 0);
    const totalCreditos = materiasEstudio.reduce((a,m) => a + m.creditos, 0);

    return `
      <div class="horario-wrapper" id="estudio-exportable">
        ${config.bgDataUrl ? `<div class="horario-bg" style="background-image:url('${config.bgDataUrl}');opacity:${config.bgOpacity}"></div>` : ''}
        <div class="horario-header-logos">
          <div class="logo-slot">${config.logoUnamDataUrl ? `<img src="${config.logoUnamDataUrl}" alt="UNAM">` : ''}</div>
          <div class="horario-header-center">
            <div class="horario-top"><div class="semestre-pill estudio-pill">Estudio Independiente — Semestre ${config.semestre || '—'}</div></div>
            <div class="horario-meta"><span class="meta-alumno">${config.alumno}</span><span class="meta-carrera">${config.carrera}</span></div>
          </div>
          <div class="logo-slot">${config.logoFiDataUrl ? `<img src="${config.logoFiDataUrl}" alt="FI">` : ''}</div>
        </div>
        ${materiasEstudio.length > 0 ? `
          <div class="estudio-resumen">
            <table class="estudio-summary-table">
              <thead><tr><th>Materia</th><th>Créditos</th><th>Hrs. clase / sem</th><th>Teoría + práctica</th><th>Hrs. estudio / sem</th></tr></thead>
              <tbody>
                ${materiasEstudio.map(m => {
                  const horasPra = m.horasPra ?? 0;
                  return `
                  <tr>
                    <td><span class="clave-tag" style="background:${m.color}">${m.clave}</span><span class="estudio-materia-nombre"> ${m.nombre}</span></td>
                    <td class="td-center">${m.creditos}</td>
                    <td class="td-center">${horasClaseSemanal(m)}</td>
                    <td class="td-center">${m.horasTeo} + ${horasPra}</td>
                    <td class="td-center estudio-highlight">${horasEstudioSugeridas(m)}</td>
                  </tr>`;
                }).join('')}
                <tr class="total-row">
                  <td><strong>TOTAL</strong></td>
                  <td class="td-center"><strong>${totalCreditos}</strong></td>
                  <td class="td-center"><strong>${totalClase}</strong></td>
                  <td class="td-center"><strong>—</strong></td>
                  <td class="td-center estudio-highlight"><strong>${totalEstudio}</strong></td>
                </tr>
              </tbody>
            </table>
          </div>
        ` : ''}
        <div class="estudio-label-row">
          ${(() => {
            const actividades = (this.state.materias||[]).filter(m => m.tipo === 'actividad');
            const actividadHtml = actividades.length ? `&nbsp;<span class="legend-dot actividad" style="background:${actividades[0].color}"></span> Actividad` : '';
            return `<span class="estudio-legend"><span class="legend-dot ocupado"></span> Clase &nbsp;<span class="legend-dot libre"></span> Tiempo disponible ${actividadHtml}</span>`;
          })()}
        </div>
        <div class="table-scroll">
          <table class="horario-table">
            <thead>
              <tr>
                <th class="th-corner"><div class="corner-inner"><span class="corner-dia">Día</span><div class="corner-divider"></div><span class="corner-hora">Hora</span></div></th>
                ${this.getDiasHorario().map(d => `<th class="th-dia">${d}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${horas.map(hora => `
                <tr>
                  ${renderCeldaHora(hora, intervalos)}
                  ${this.getDiasHorario().map(dia => {
                    const info = this.getCellInfo(dia, hora);
                    if (info && info.sesion.horaInicio < hora) return '';
                    if (!info) return `<td class="td-cell td-libre"><div class="libre-inner"><div class="libre-line"></div><div class="libre-line"></div></div></td>`;
                    const { materia, sesion } = info;
                    const rowspan = sesion.horaFin - sesion.horaInicio;
                    return `<td rowspan="${rowspan}" class="td-cell td-ocupada">
                      <div class="cell-inner">
                        <div class="cell-bar" style="background:${materia.color}"></div>
                        <div class="cell-body">
                          <div class="cell-nombre" style="font-size:0.7rem">${materia.nombre}</div>
                          <div class="cell-sub">${materia.clave}</div>
                        </div>
                      </div>
                    </td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        ${!materias.length ? `<div class="empty-state">Agrega materias en <strong>Horario</strong> para ver tu planeación.</div>` : ''}
      </div>
      ${this.renderPlantillaSemanal()}
    `;
  },

  renderPlantillaSemanal() {
    const materias = ordenarPorClave(materiasConEstudio(this.state.materias));
    if (!materias.length) return '';
    return `
      <div class="plantilla-explicacion">
        <h3>📋 Plantilla de seguimiento semanal</h3>
        <p>
          Usa esta plantilla para llevar un registro de tus horas de estudio independiente cada semana.
          Marca los checkboxes conforme completes cada hora de estudio, anota los temas revisados y cualquier
          observación personal. <strong>Cada cuadro representa una hora</strong> de estudio independiente por semana
          según el plan de créditos de cada asignatura.
        </p>
        <div class="plantilla-export-btn">
          <button class="btn-primary" onclick="App.exportarPlantillaPDF()">⬇ Exportar plantilla PDF</button>
        </div>
      </div>
      <div id="plantilla-exportable" class="plantilla-wrapper">
        <div class="plantilla-week-header">
          <div class="plantilla-week-title">Semana del _________ al _________</div>
          <div class="plantilla-week-dates">Semestre ${this.state.config.semestre || '—'} · ${this.state.config.alumno || 'Alumno'}</div>
        </div>
        ${materias.map(m => {
          const horas = horasEstudioSugeridas(m);
          const checkboxes = Array.from({length: horas}, (_, i) => `
            <label class="hora-checkbox">
              <input type="checkbox"> Hora ${i+1}
            </label>
          `).join('');
          return `
            <div class="plantilla-materia-block">
              <div class="plantilla-materia-header">
                <span class="plantilla-materia-nombre-h">
                  <span style="display:inline-block;background:${m.color};color:#fff;padding:1px 8px;border-radius:4px;font-size:0.75rem;margin-right:8px">${m.clave}</span>${m.nombre}
                </span>
                <span class="plantilla-horas-label">Horas de estudio independiente: <strong>${horas}</strong></span>
              </div>
              <div class="plantilla-materia-row">
                <div class="plantilla-materia-nombre-cell">${m.nombre}</div>
                <div class="plantilla-checkboxes">${checkboxes}</div>
              </div>
              <div class="plantilla-notas">
                <span class="notas-label">Notas / Observaciones</span>
                <textarea class="notas-textarea" placeholder="Temas revisados, páginas, dudas…"></textarea>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  },

  // ── VISTA CONFIG ─────────────────────────────────────────────────────
  renderVistaConfig() {

          <div class="config-field"><label>Nombre del alumno</label><input id="cfg-alumno" value="${config.alumno}" oninput="App.setConfig('alumno',this.value,'cfg-alumno')" placeholder="Nombre completo"></div>

        <section class="config-section">

                <span style="font-size:0.8rem;color:var(--text-mid)">${config.tableLineColor}</span>
              </div>
            </div>
            <div class="config-field">
              <label>Celdas con clase</label>
              <div style="display:flex;gap:10px;align-items:center">
                <input type="color" value="${config.tableCellBg}" onchange="App.setConfig('tableCellBg',this.value)" style="width:40px;height:36px;border-radius:6px;border:1px solid var(--border);padding:2px;cursor:pointer">
                <span style="font-size:0.8rem;color:var(--text-mid)">${config.tableCellBg}</span>

              <div style="display:flex;gap:10px;align-items:center">
                <input type="color" value="${config.semestreBg}" onchange="App.setConfig('semestreBg',this.value)" style="width:40px;height:36px;border-radius:6px;border:1px solid var(--border);padding:2px;cursor:pointer">
                <span style="font-size:0.8rem;color:var(--text-mid)">${config.semestreBg}</span>
              </div>
            </div>
          </div>
        </section>

        <section class="config-section">
          <h3 class="config-section-title">Imagen de fondo del horario</h3>
          <div class="bg-upload-area">
            <div class="bg-preview">
              ${config.bgDataUrl ? `<img src="${config.bgDataUrl}">` : '<span style="font-size:0.7rem;color:var(--text-soft);text-align:center;padding:6px">Sin fondo</span>'}
            </div>
            <div style="flex:1">
              <input type="file" id="bg-upload" class="logo-upload-input" accept="image/*" onchange="App.subirFondo(event)">

                <button class="btn-ghost" onclick="document.getElementById('bg-upload').click()">📷 Subir imagen</button>
                ${config.bgDataUrl ? `<button class="btn-remove-logo" onclick="App.setConfig('bgDataUrl',null)">✕ Quitar</button>` : ''}

              ${config.bgDataUrl ? `
                <div class="opacity-slider-wrap">

              <input type="file" id="logo-unam" class="logo-upload-input" accept="image/*" onchange="App.subirLogo('logoUnamDataUrl',event)">

              <div class="logo-preview-box" onclick="document.getElementById('logo-fi').click()">
                ${config.logoFiDataUrl ? `<img src="${config.logoFiDataUrl}">` : '<span class="logo-placeholder">Logo Facultad<br>click para subir</span>'}

        ${materias.length > 0 ? `
          <section class="config-section">

              ${ordenarPorClave(materias).map(m => `
                <div class="config-materia-row">
                  <span class="clave-tag" style="background:${m.color}">${m.clave}</span>
                  <span class="config-materia-nombre">${m.nombre}</span>
                  <span class="config-materia-creds">${m.creditos} cr.</span>
                  <input type="color" value="${m.color}" onchange="App.actualizarColor('${m.id}',this.value)" title="Cambiar color" class="color-input-sm">
                  <button class="btn-delete-materia" onclick="App.eliminarMateria('${m.id}')" title="Eliminar">🗑</button>
                </div>
              `).join('')}
            </div>
          </section>
        ` : `<div class="empty-state">Aún no has agregado materias.</div>`}
      </div>
    `;
  },

  // ── MODAL FORMULARIO ─────────────────────────────────────────────────
  abrirModal(editId, tipo = 'materia') {
    this.state.formAbierto = true;
    this.state.editandoId = editId || null;
    this.state.formTipo = tipo;
    if (editId) {
      const m = this.state.materias.find(x => x.id === editId);
      const esActividad = m?.tipo === 'actividad';
      this.state.formTipo = esActividad ? 'actividad' : 'materia';
      this.state.form = {
        busqueda: m.nombre,
        seleccionada: esActividad ? null : { clave: m.clave, nombre: m.nombre, creditos: m.creditos, horasTeo: m.horasTeo, horasPra: m.horasPra, facultad: m.facultad },
        profesor: m.profesor || '',
        grupo: m.grupo || '',
        salon: m.salon || '',
        mismoSalon: m.mismoSalon !== false,
        mismoHorario: false,
        color: m.color,
        duracionCustom: true,
        sesiones: JSON.parse(JSON.stringify(m.sesiones)).map(s => ({ salon: m.salon || '', ...s })),
        error: '',
        conflictos: [],
        nombreActividad: esActividad ? m.nombre : '',
        descripcion: esActividad ? (m.descripcion || '') : ''
      };
    } else {
      this.state.form = {
        busqueda: '', seleccionada: null, profesor: '', grupo: '', salon: '',
        mismoSalon: true,
        mismoHorario: true,
        color: COLORES[Math.floor(Math.random() * COLORES.length)],
        duracionCustom: false,
        sesiones: [{ dia: 'Lunes', horaInicio: 7, horaFin: 9, salon: '', esLab: false }],
        error: '', conflictos: [],
        nombreActividad: '',
        descripcion: ''
      };
    }
    this.render();
  },

  abrirEditar(id) { this.abrirModal(id); },
  cerrarModal() { this.state.formAbierto = false; this.state.editandoId = null; this.render(); },

  buscarMateria(val) {
    this.state.form.busqueda = val;
    this.state.form.seleccionada = null;
    this._focusField = 'busqueda-input';
    this.render();
  },

  seleccionarMateria(clave) {
    const m = materiasDB.find(x => x.clave === clave);
    this.state.form.seleccionada = { clave: m.clave, nombre: m.nombre, creditos: m.creditos, horasTeo: m.horasTeo, horasPra: m.horasPra, facultad: m.facultad };
    this.state.form.busqueda = m.nombre;
    this.state.form.error = '';
    this.render();
  },

  toggleDuracionCustom(checked) { this.state.form.duracionCustom = checked; this.render(); },
  toggleMismoHorario(checked) {
    const f = this.state.form;
    f.mismoHorario = checked;
    if (checked && f.sesiones.length) {
      const base = f.sesiones[0];
      f.sesiones = f.sesiones.map(s => ({ ...s, dia: base.dia, horaInicio: base.horaInicio, horaFin: base.horaFin }));
    }
    this.render();
  },
  toggleMismoSalon(checked) {
    const f = this.state.form;
    f.mismoSalon = checked;
    if (checked) f.sesiones.forEach(s => { s.salon = f.salon; });
    this.render();
  },
  setSalonGeneral(value) {
    const f = this.state.form;
    f.salon = value;
    if (f.mismoSalon) f.sesiones.forEach(s => { s.salon = value; });
  },
  addSesion() {
    const f = this.state.form;
    const base = f.sesiones[0] || { dia: 'Lunes', horaInicio: 7, horaFin: 9 };
    const nuevaSesion = {
      dia: base.dia,
      horaInicio: base.horaInicio,
      horaFin: base.horaFin,
      salon: f.mismoSalon ? f.salon : '',
      esLab: false
    };
    f.sesiones.push(nuevaSesion);
    if (f.mismoHorario) {
      const referencia = f.sesiones[0];
      f.sesiones = f.sesiones.map(s => ({ ...s, dia: referencia.dia, horaInicio: referencia.horaInicio, horaFin: referencia.horaFin }));
    }
    this.render();
  },
  removeSesion(i) { this.state.form.sesiones.splice(i, 1); this.render(); },
  updateSesion(i, field, value) {
    const f = this.state.form;
    f.sesiones[i][field] = value;
    if (field === 'salon') return;
    if (field === 'horaInicio' && !f.duracionCustom) f.sesiones[i].horaFin = parseInt(value) + 2;
    if (f.mismoHorario && ['dia', 'horaInicio', 'horaFin'].includes(field)) {
      const base = { dia: f.sesiones[i].dia, horaInicio: f.sesiones[i].horaInicio, horaFin: f.sesiones[i].horaFin };
      f.sesiones = f.sesiones.map(s => ({ ...s, ...base }));
    }
    this.render();
  },
  setColor(c) { this.state.form.color = c; this.render(); },

  // Detección de conflictos (excluye la materia que se está editando)
  detectarConflictos(sesiones) {
    const editandoId = this.state.editandoId;
    const conflictos = [];
    for (const s of sesiones) {
      const ocupante = this.state.materias.find(m =>
        m.id !== editandoId &&
        m.sesiones.some(ms =>
          ms.dia === s.dia &&
          ms.horaInicio < s.horaFin &&
          ms.horaFin > s.horaInicio
        )
      );
      if (ocupante) {
        const conflSesion = ocupante.sesiones.find(ms =>
          ms.dia === s.dia && ms.horaInicio < s.horaFin && ms.horaFin > s.horaInicio
        );
        conflictos.push(`${s.dia} ${s.horaInicio}:00–${s.horaFin}:00 choca con <strong>${ocupante.nombre}</strong> (${conflSesion.horaInicio}:00–${conflSesion.horaFin}:00)`);
      }
    }
    return conflictos;
  },

  guardarMateria() {
    const f = this.state.form;
    const esActividad = this.state.formTipo === 'actividad';
    if (esActividad) {
      if (!f.nombreActividad.trim()) { f.error = 'Ingresa el nombre de la actividad.'; this.render(); return; }
    } else {
      if (!f.seleccionada) { f.error = 'Selecciona una materia del catálogo.'; this.render(); return; }
      if (!f.profesor.trim()) { f.error = 'Ingresa el nombre del profesor.'; this.render(); return; }
    }
    if (!f.sesiones.length) { f.error = 'Agrega al menos una sesión.'; this.render(); return; }

    if (!esActividad && f.seleccionada) {
      const yaExiste = this.state.materias.some(m =>
        m.id !== this.state.editandoId &&
        m.tipo !== 'actividad' &&
        m.clave === f.seleccionada.clave
      );
      if (yaExiste) {
        f.error = 'Esta materia ya está agregada al horario.';
        this.render();
        return;
      }
    }

    const conflictos = this.detectarConflictos(f.sesiones);
    if (conflictos.length) {
      f.conflictos = conflictos;
      f.error = '';
      this.render();
      return;
    }

    const datos = esActividad ? {
      tipo: 'actividad',
      clave: 'ACT',
      nombre: f.nombreActividad.trim(),
      descripcion: f.descripcion.trim(),
      creditos: 0,
      horasTeo: null,
      horasPra: null,
      facultad: null,
      profesor: '',
      grupo: '',
      salon: f.salon.trim(),
      mismoSalon: f.mismoSalon,
      color: f.color,
      sesiones: JSON.parse(JSON.stringify(f.sesiones)).map(s => ({
        ...s,
        salon: f.mismoSalon ? f.salon.trim() : (s.salon || '').trim()
      }))
    } : {
      tipo: 'materia',
      clave: f.seleccionada.clave, nombre: f.seleccionada.nombre,
      creditos: f.seleccionada.creditos,
      horasTeo: f.seleccionada.horasTeo ?? null,
      horasPra: f.seleccionada.horasPra ?? null,
      facultad: f.seleccionada.facultad ?? null,
      profesor: f.profesor.trim(),
      grupo: f.grupo.trim(), salon: f.salon.trim(),
      mismoSalon: f.mismoSalon,
      color: f.color,
      sesiones: JSON.parse(JSON.stringify(f.sesiones)).map(s => ({
        ...s,
        salon: f.mismoSalon ? f.salon.trim() : (s.salon || '').trim()
      }))
    };

    if (this.state.editandoId) {
      const idx = this.state.materias.findIndex(m => m.id === this.state.editandoId);
      if (idx !== -1) this.state.materias[idx] = { ...this.state.materias[idx], ...datos };
    } else {
      this.state.materias.push({ id: crypto.randomUUID(), ...datos });
    }
    this.cerrarModal();
  },

        ).slice(0, 7)
      : [];

            <div style="min-width:155px">
              <label>Filtrar por facultad</label>
              <select onchange="App.setFiltroFacultad(this.value)" style="width:100%;padding:8px 10px;font-size:0.82rem;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.09);color:#fff">
                <option value="" ${!ff?'selected':''}>Todas</option>
                ${FACULTADES.map(fac=>`<option value="${fac.clave}" ${ff===fac.clave?'selected':''}>${fac.clave} – ${fac.nombre}</option>`).join('')}
              </select>

          ${!esActividad && f.seleccionada ? `
            <div class="selected-badge" style="margin: 0 24px 4px;">

                    <select onchange="App.updateSesion(${i},'horaFin',parseInt(this.value))">

  // ── UTILIDADES ───────────────────────────────────────────────────────
  getCellInfo(dia, hora) {
    const materia = this.state.materias.find(m =>
      m.sesiones?.some(s => s.dia===dia && s.horaInicio<=hora && s.horaFin>hora)
    );
    if (!materia) return null;
    const sesion = materia.sesiones.find(s => s.dia===dia && s.horaInicio<=hora && s.horaFin>hora);
    return { materia, sesion };
  },

  // ── SUBIDA DE ARCHIVOS ───────────────────────────────────────────────
  subirFondo(event) {

    reader.onload = e => { this.setConfig('bgDataUrl', e.target.result); };

  // ── EXPORTACIÓN ICS ─────────────────────────────────────────────────
  exportarICS() {
    const { config, materias } = this.state;
    if (!config.fechaInicio || !config.fechaFin) {
      alert('Configura las fechas de inicio y fin del semestre en Configuración antes de exportar al calendario.');
      return;
    }
    if (!materias.length) { alert('No hay materias en el horario.'); return; }

    const diasSemana = { 'Lunes': 'MO', 'Martes': 'TU', 'Miércoles': 'WE', 'Jueves': 'TH', 'Viernes': 'FR', 'Sábado': 'SA', 'Domingo': 'SU' };
    const diasOffset = { 'Lunes': 1, 'Martes': 2, 'Miércoles': 3, 'Jueves': 4, 'Viernes': 5, 'Sábado': 6, 'Domingo': 0 };

    function toICSDate(dateStr, hour) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setHours(hour, 0, 0, 0);
      return d.toISOString().replace(/[-:]/g,'').replace('.000','');
    }

    function firstOccurrence(startDateStr, targetDow) {
      const d = new Date(startDateStr + 'T00:00:00');
      const dow = d.getDay(); // 0=Sun, 1=Mon...
      const diff = ((targetDow - dow + 7) % 7);
      d.setDate(d.getDate() + diff);
      return d.toISOString().split('T')[0];
    }

    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Generador Horarios UNAM FI//ES\r\nCALSCALE:GREGORIAN\r\n';

    for (const m of materias) {
      for (const s of m.sesiones) {
        const salon = salonSesion(m, s);
        const dow = diasOffset[s.dia];
        const firstDate = firstOccurrence(config.fechaInicio, dow);
        const uid = crypto.randomUUID();
        ics += `BEGIN:VEVENT\r\n`;
        ics += `UID:${uid}\r\n`;
        ics += `DTSTART:${toICSDate(firstDate, s.horaInicio)}\r\n`;
        ics += `DTEND:${toICSDate(firstDate, s.horaFin)}\r\n`;
        ics += `RRULE:FREQ=WEEKLY;BYDAY=${diasSemana[s.dia]};UNTIL:${toICSDate(config.fechaFin, 23).replace('T230000','T235959')}\r\n`;
        ics += `SUMMARY:${m.nombre} [${m.clave}]${s.esLab?' (LAB)':''}\r\n`;
        ics += `DESCRIPTION:Profesor: ${m.profesor}\\nGrupo: ${m.grupo}\\nSalón: ${salon}\r\n`;
        ics += `LOCATION:${salon}\r\n`;
        ics += `END:VEVENT\r\n`;
      }
    }

    ics += 'END:VCALENDAR';

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `horario-${config.semestre || 'semestre'}.ics`;
    a.click();
  },

  // ── EXPORTACIÓN PNG / PDF ─────────────────────────────────────────────
  async exportarPNG() {
    this.state.exporting = true; this.render();
    try {
      const id = this.state.vista === 'estudio' ? 'estudio-exportable' : 'horario-exportable';
      const el = document.getElementById(id);
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const a = document.createElement('a');
      a.download = `horario-${this.state.config.semestre||'sem'}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } finally { this.state.exporting = false; this.render(); }
  },

  async exportarPDF() {
    this.state.exporting = true; this.render();
    try {
      const id = this.state.vista === 'estudio' ? 'estudio-exportable' : 'horario-exportable';
      const el = document.getElementById(id);
      // Apply compact export styles to reduce row heights for PDF fit
      el.classList.add('export-compact');
      // Render at higher scale for better quality
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      // Remove the compact class after capture so UI returns to normal
      el.classList.remove('export-compact');

      const imgData = canvas.toDataURL('image/png');
      // Force letter landscape and 1.27cm margins
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 12.7; // 1.27 cm in mm
      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;

      const imgRatio = canvas.width / canvas.height;
      // Compute draw size in mm keeping aspect ratio
      let drawW = usableW;
      let drawH = drawW / imgRatio;
      if (drawH > usableH) {
        drawH = usableH;
        drawW = drawH * imgRatio;
      }

      // Center horizontally within usable width and place at top margin
      const x = margin + Math.max(0, (usableW - drawW) / 2);
      const y = margin;
      pdf.addImage(imgData, 'PNG', x, y, drawW, drawH);
      pdf.save(`horario-${this.state.config.semestre||'sem'}.pdf`);
    } finally { this.state.exporting = false; this.render(); }
  },

  async exportarPlantillaPDF() {
    this.state.exporting = true; this.render();
    try {
      const el = document.getElementById('plantilla-exportable');
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/png');
      // Carta: 216 x 279 mm
      const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 10; // mm
      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;
      const imgW = canvas.width;
      const imgH = canvas.height;
      const ratio = imgW / imgH;
      let drawW = usableW;
      let drawH = drawW / ratio;
      // If content taller than one page, split across pages
      const pageContentH = usableH;
      const pxPerMm = imgW / drawW;
      const pxPerPage = pageContentH * pxPerMm;
      let yOffset = 0;
      let pageCount = 0;
      while (yOffset < imgH) {
        if (pageCount > 0) pdf.addPage('letter', 'portrait');
        // Create a slice canvas
        const sliceH = Math.min(pxPerPage, imgH - yOffset);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = imgW;
        sliceCanvas.height = sliceH;
        const ctx = sliceCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, yOffset, imgW, sliceH, 0, 0, imgW, sliceH);
        const sliceData = sliceCanvas.toDataURL('image/png');
        const sliceDrawH = sliceH / pxPerMm;
        pdf.addImage(sliceData, 'PNG', margin, margin, usableW, sliceDrawH);
        yOffset += sliceH;
        pageCount++;
      }
      pdf.save(`plantilla-semanal-${this.state.config.semestre||'sem'}.pdf`);
    } finally { this.state.exporting = false; this.render(); }
  }
};

window.App.init();

  </script>
